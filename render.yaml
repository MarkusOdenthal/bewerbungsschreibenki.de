services:
  - type: web
    name: bewerbungsschreibenki-de
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_PLAUSIBLE_DOMAIN
        sync: false
      - key: PUBLIC_PLAUSIBLE_SCRIPT_URL
        sync: false
      - key: PUBLIC_FARO_COLLECTOR_URL
        sync: false
      - key: PUBLIC_STRIPE_PAYMENT_LINK
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), microphone=(), camera=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.pixabay.com https://images.unsplash.com; connect-src 'self' https://plausible.io"
      - path: /_astro/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
